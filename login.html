<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        *{
           
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
            a{
                text-decoration: none;
            }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid bg-primary p-3">
    <div class="nav justify-content-between">
        <div>
    <button class="btn btn-primary text-white "><a href="dashboard.html" class="text-white">Dashboard</a> &nbsp; </button>
    <button class="btn btn-primary text-white"><a href="addstudents.html" class="text-white">Add Student </a> &nbsp; </button>
    <button class="btn btn-primary text-white"><a href="viewstudent.html" class="text-white">View Student Details</a> &nbsp; </button>
    </div>
    <button class="btn btn-primary text-white"><a href="logout.html" class="text-white">Logout</a></button>
    </div>
</div>
    <div class="form container mt-5 p-5 bg-light w-50 rounded">
        <h1>Login</h1>
        <form onsubmit="check()">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    <script>
        function check(){
            event.preventDefault();
            var username=document.getElementById('username').value;
        var password=document.getElementById('password').value;
        var passd=localStorage.getItem(username);
        var pass=JSON.parse(passd).password;
        if(password==pass){
            location.href='dashboard.html'
        }
        else{
            alert('invalid username or password');
            location.href='login.html'
        }
        }

    </script>
    
</body>
</html>
